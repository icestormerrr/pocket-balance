services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: pocket-balance-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - C:/Games/pocket-balance:/workspace/pocket-balance

volumes:
  jenkins_home:
